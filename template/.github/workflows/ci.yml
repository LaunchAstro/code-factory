name: ci

# Every action below is pinned to a full commit hash. A tag can be moved; a
# hash cannot. The comment beside each one says which release it was, so a
# human can read the file and a bot can bump it.

on:
  pull_request:
    # No label wakes this workflow. A size waiver still has to rerun the gate
    # it waives, which is round four's finding, and that rerun now belongs to
    # `pr-size.yml`, the one workflow that reports `pull request size`. Round
    # five watched `held` start the whole of this one on a head nobody had
    # pushed to, and a guard by label name is not the repair: GitHub filters
    # this trigger by action and never by label, so the run is created anyway,
    # it cancels whatever real run is in progress, and every job it skips still
    # reports its context. A skipped required check is not a red one.
    # `edited` matters as much as the rest: the acceptance check reads
    # `Closes #<n>` out of the pull request body to know which ticket the
    # plan directory has to be numbered for, so editing the body must refresh
    # the result. Round five found it, when the body still carried typed
    # review evidence; ticket 52 cut that, and the ticket number is what is
    # left of what the body decides.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Read-only by default. A job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # First job, and deliberately first: a repository with client material in
    # it is not made acceptable by passing its type checks.
    name: contamination gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Required scanner runtime
        run: python3 -c "import sys; assert sys.version_info >= (3, 11), 'Python 3.11 or newer is required'"
      - name: Self-test, before anything is believed
        run: python3 scripts/gate/sweep.py --self-test
      - name: The cases the gate once missed
        run: bash tests/gate/gate-cases.sh
      - name: The pre-push hook's exit-code policy, under Husky's shell
        run: bash tests/gate/hook-exit-cases.sh
      - name: Every action pinned to a hash, and every pin recorded
        run: node scripts/pins-check.mjs
      - name: Every skill reference resolves
        run: node scripts/skill-refs-check.mjs
      - name: The session check passes on a clean checkout
        run: bash scripts/agent-session-check.sh
      - name: The session check's own scope cases
        run: bash tests/agents/session-check-cases.sh
      - name: Nothing merges itself
        run: node scripts/merge-policy-check.mjs
      - name: Sweep every blob in the incoming commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/gate/sweep.py --range "$BASE_SHA..$HEAD_SHA"
      - name: Sweep every tracked file
        run: python3 scripts/gate/sweep.py
      - name: Public content and metadata in every incoming commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/public-content-check.mjs --repo "$PWD" --range "$BASE_SHA..$HEAD_SHA"
      - name: Public content and metadata from the root
        if: github.event_name == 'push'
        run: node scripts/public-content-check.mjs --repo "$PWD" --range HEAD

  secrets:
    name: gitleaks over the full history
    # Nothing runs before the gate. A repository with client material in it is
    # not made acceptable by passing its other checks, and dependency install
    # executes third-party code, so it waits too. YAML order is not execution
    # order; only `needs` is.
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks, verified before it is extracted
        env:
          # Pinned by version and by digest. The digest is the one published
          # in the release's own checksums file, and it was checked against a
          # downloaded archive on 6 September 2026 before being written here.
          # Piping a download straight into tar runs whatever arrives.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSL --fail -o "$archive" "${base}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          # Only now, with the bytes proved, is anything unpacked.
          tar -xzf "$archive" gitleaks
          rm -f "$archive"
          ./gitleaks version
      - name: Scan every commit, not just the diff
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml .

  check:
    name: local checks
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # After the install: the timeout check parses workflows with yaml, and
      # the gate job above runs before any dependency is installed.
      - name: Every workflow job declares a timeout
        env:
          JOB_TIMEOUT_STRICT: '1'
        run: node scripts/job-timeout-check.mjs
      - name: Required local toolchain
        run: python3 -c "import sys; assert sys.version_info >= (3, 11), 'Python 3.11 or newer is required'"
      - run: pnpm check
      - name: Public content in the actual checked-out snapshot
        run: node scripts/public-content-check.mjs --repo "$PWD"

  licences:
    name: OSI licence allowlist
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The checker's own negative cases
        run: bash tests/licences/licence-cases.sh
      - run: pnpm run licences

  commits:
    name: commit messages and provenance
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every commit in the pull request, not only the tip
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/commit-range-check.mjs
      # A pull request's own range never contains the merge commit that closes
      # it, so nothing ran the rule over a whole history and nothing refused a
      # main whose every merge broke it. Sol's second review of #15 found that
      # the exemption had no caller. This is the caller: the whole history of
      # main, on every push to it, with the tip as its own base.
      - name: Every commit on main, including the merges GitHub wrote
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.sha }}
          HUB_RANGE_INCLUDE_ROOT: '1'
        run: node scripts/commit-range-check.mjs
      - name: The checker's own cases
        run: bash tests/ci/commit-range-cases.sh

  acceptance:
    # The plan stage commits the failing tests first. This job is the only
    # thing that makes that true rather than asked for: it reads git and
    # vitest, and it reads one integer out of the body and nothing else.
    name: the plan's tests were red before the code
    needs: [gate]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The head being merged, with the whole history: the check needs the
      # merge base and the first commit on the branch, and it checks both of
      # them out again into throwaway worktrees to run vitest at each.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Red at the plan commit, untouched since, green at this head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/acceptance-check.mjs
      - name: The checker's own cases
        run: bash tests/ci/acceptance-cases.sh

  # No job here reports the evidence context, and that is deliberate. Nothing
  # in this workflow can know the verdict on a head, so on an unreviewed head
  # the job could only fail, and a required context red for want of a review is
  # indistinguishable from one red for a fault. Worse, the merge stayed blocked
  # by that stale run after the review landed green from
  # `.github/workflows/review-evidence.yml`, because GitHub holds a merge while
  # either reporting workflow's latest run of a context is red. Ticket 1.
  #
  # That workflow now reports it alone, on a review arriving. An unreviewed
  # head has no check run for it at all, and GitHub blocks a merge on a
  # required context with no run on the head being merged, so the gate is
  # unchanged in what it permits: a push after an approval is blocked again
  # until a new review event runs the workflow on the new head.
  #
  # The context name, the checker and its cases are deliberately not written
  # anywhere in this file, and the review evidence cases refuse a ci.yml that
  # carries any of the three, so the job cannot come back by accident.

  # `pull request size` is reported by `.github/workflows/pr-size.yml` and by
  # nothing here. It is the one context a label decides, so it is the one that
  # has to run on a label, and a workflow this heavy must not. Two workflows
  # reporting one context is ticket 1, where either one's stale run held the
  # merge; the acceptance case for ticket 10 refuses a job of that name in this
  # file.
